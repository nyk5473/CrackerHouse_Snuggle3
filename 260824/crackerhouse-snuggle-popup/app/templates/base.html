<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}크래커하우스 X 스너글 팝업스토어{% endblock %}</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
@font-face {
  font-family: 'LeeOkSun';
  src: url('images/그녀_이옥선.ttf') format('truetype'),
       url('그녀_이옥선.ttf') format('truetype'),
       url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_ten@1.0/Her-Leeoksun.woff') format('woff');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'SheLeeOkSun';
  src: url('images/그녀_이옥선.ttf') format('truetype'),
       url('그녀_이옥선.ttf') format('truetype'),
       url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_ten@1.0/Her-Leeoksun.woff') format('woff');
  font-weight: normal;
  font-style: normal;
}

h1, h2, h3, .hero-title, .products-big-title, .prereg-headline, .brand-headline, .page-title, .kiosk-title, .waiting-title, .zone-header {
  font-family: 'LeeOkSun', 'SheLeeOkSun', 'Playfair Display', serif !important;
}
</style>

<style>
  /* 그녀-이옥순 (LeeOkSun) 폰트 - 히어로 영문 포인트 (lan, wei, ness) 및 주황색 글씨 전면 적용 */
  .hw--serif, 
  em, 
  .orange-text,
  [style*="color: var(--orange)"],
  [style*="color:var(--orange)"],
  [style*="color: #F25C05"],
  [style*="color:#F25C05"],
  .pa-price,
  .product-card__price,
  .pa-info-link,
  .brand-headline span,
  .products-big-title em,
  .kiosk-title em,
  .page-title em {
    font-family: 'LeeOkSun', 'SheLeeOkSun', 'Playfair Display', serif !important;
  }

  .hw--serif {
    color: var(--orange) !important;
    font-weight: 700 !important;
  }
</style>


<style>
  /* 그녀-이옥순 (LeeOkSun) 폰트 - 요청된 핵심 타이틀 4종 전면 적용 */
  .prereg-headline,
  .products-big-title,
  .brand-headline,
  #laundry-section .ls-title,
  .page-title,
  .laundry-title,
  h1, h2, h3 {
    font-family: 'LeeOkSun', 'SheLeeOkSun', 'Playfair Display', serif !important;
  }
</style>

</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <a class="logo" href="/">CRACKER<span class="x">X</span>SNUGGLE</a>
    <nav>
      <a href="/brand" class="{{ 'active' if request.url.path == '/brand' else '' }}">브랜드소개</a>
      <a href="/popup" class="{{ 'active' if request.url.path == '/popup' else '' }}">팝업정보</a>
      <a href="/products" class="{{ 'active' if request.url.path == '/products' else '' }}">상품</a>
      <a href="/guestbook" class="{{ 'active' if request.url.path == '/guestbook' else '' }}">방명록</a>
      <a href="/register" class="{{ 'active' if request.url.path == '/register' else '' }}">사전등록</a>
    </nav>
  </header>

  {% block content %}{% endblock %}

  <footer class="footer">
    스타필드 빌리지 팝업스토어 · CRACKERHOUSE X SNUGGLE<br>
    <a href="/kiosk">현장예약 키오스크 바로가기</a> · <a href="/admin">관리자</a>
  </footer>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
